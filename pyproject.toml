[project]
name = "born-field"
version = "0.1.0"
description = "Geospatial collision risk intelligence: intensity field -> calibrated hazard model -> risk API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Born Field" }]
keywords = ["geospatial", "risk", "poisson", "traffic-safety", "hazard-model"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]

# Core runtime. Deliberately small: everything here is imported by src/born_field
# at Stage 0. Heavier stacks live in extras and are promoted stage by stage so CI
# stays fast and dependency-resolution failures surface one layer at a time.
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Stage 1: synthetic generator over a real road-network extract.
geo = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pandas>=2.2",
]
# Stages 2-3: baselines, hazard model, experiment tracking.
model = [
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "mlflow>=2.14",
  "matplotlib>=3.8",
]
# Stage 4: PostGIS + serving.
serve = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "geoalchemy2>=0.15",
  "psycopg[binary]>=3.1",
  "prometheus-client>=0.20",
]
# Stage 5: query-time agent.
agent = [
  "langgraph>=0.2",
  "langfuse>=2.40",
  "anthropic>=0.34",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "ruff>=0.5",
  "pandas-stubs>=3.0.5.260730",
  "types-shapely>=2.1.0.20260728",
  "httpx>=0.27",
]

[project.scripts]
bornfield = "born_field.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/born_field"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # import sorting
  "N",             # pep8-naming
  "UP",            # pyupgrade
  "B",             # bugbear
  "A",             # builtin shadowing
  "C4",            # comprehensions
  "SIM",           # simplify
  "ARG",           # unused arguments
  "PTH",           # pathlib over os.path
  "RUF",
  "ANN",           # require annotations (paired with mypy --strict)
  "D",             # docstrings
]
ignore = [
  "D107",  # __init__ docstring: covered by the class docstring
  "D203",  # incompatible with D211
  "D213",  # incompatible with D212
]

# Greek letters and maths operators appear in docstrings stating the hazard law.
# Writing it as "alpha" in prose but "α" in the formula is the readable choice.
allowed-confusables = ["α", "λ", "·", "≈", "×"]

[tool.ruff.lint.per-file-ignores]
# Test names are the documentation; docstrings are reserved for tests whose
# *reasoning* is non-obvious, and several here have one for exactly that reason.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "ANN001", "ANN201", "ANN202"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Types. Strict everywhere: the adapter/model Protocols are the product's
# extension contract, so an unchecked signature is a broken promise to a buyer.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["born_field"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# These scientific libraries ship no type information and have no types-*
# package. Our own code stays strictly typed; the untyped boundary stops at the
# library import rather than leaking Any through the codebase.
[[tool.mypy.overrides]]
module = ["geopandas.*", "statsmodels.*", "sklearn.*", "scipy.*", "mlflow.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "slow: long-running experiments (excluded from the default CI run)",
  "requires_db: needs a live PostGIS instance",
]
